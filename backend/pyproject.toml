[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS GraphRAG portfolio backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "openai",
    "httpx",
    "pymilvus>=2.5,<2.6",
    "psycopg[binary]",
    "faker",
    "neo4j>=5",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "langgraph>=1.2.24",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.pytest.ini_options]
markers = ["integration", "live"]
addopts = "-m 'not integration and not live' --import-mode=importlib"

[tool.ruff]
line-length = 100
